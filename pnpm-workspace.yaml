# =============================================================================
# pnpm workspace configuration  (pnpm 11)
# =============================================================================
# In pnpm 11 the `pnpm` key in package.json is no longer read and .npmrc only
# carries registry/auth settings, so every workspace setting lives here.
# =============================================================================

packages:
  - "apps/*"
  - "packages/*"
  - "!**/dist/**"
  - "!**/.next/**"
  - "!**/generated/**"

# -----------------------------------------------------------------------------
# Linking and layout
# -----------------------------------------------------------------------------
nodeLinker: isolated
# Internal dependencies always use the explicit `workspace:*` protocol, so bare
# semver ranges must NOT silently resolve to a local package — that hides drift.
linkWorkspacePackages: false
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling
sharedWorkspaceLockfile: true
# Deliberately false. Injection *copies* workspace packages into node_modules,
# so a newly added source file is invisible until the next install — which makes
# the inner development loop wrong in a way that is very hard to diagnose.
# Symlinks keep it instant. The production images do not need injection: the
# services are bundled with tsup, which inlines workspace sources at build time.
injectWorkspacePackages: false
autoInstallPeers: true
dedupePeerDependents: true
# The TypeScript side-by-side arrangement (see docs/adr/0001-typescript-version.md)
# installs the TS 6 API under the `typescript` name, which trips a few advisory
# peer ranges that are satisfied in practice.
strictPeerDependencies: false
# `warn` rather than `install`: a full install check on every `pnpm exec` is
# too slow to sit in the inner loop, but a stale node_modules should still be
# visible. CI runs `pnpm install --frozen-lockfile` explicitly.
verifyDepsBeforeRun: warn

# Large tarballs (next, @prisma/*, esbuild platform binaries) time out on slow
# or throttled links with the defaults; these values make installs reliable
# without masking a genuinely broken registry.
fetchTimeout: 300000
fetchRetries: 5
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 120000
networkConcurrency: 8

# -----------------------------------------------------------------------------
# Dependency build scripts
# -----------------------------------------------------------------------------
# pnpm blocks lifecycle scripts by default; `strictDepBuilds` turns an
# unreviewed build script into a hard install failure rather than a warning.
# Each entry below was reviewed before being allowed.
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  "@prisma/client": true # generate hook
  "@prisma/engines": true # schema engine used by prisma migrate
  prisma: true # CLI postinstall
  esbuild: true # platform binary (tsup, tsx, vitest)
  "@tailwindcss/oxide": true # Tailwind v4 native binary
  sharp: true # Next.js image optimisation
  unrs-resolver: true # eslint import resolver native binary
  "@swc/core": true # used by Next.js tooling
  "@parcel/watcher": true # file watching for prisma studio / dev
  msgpackr-extract: true # native msgpack acceleration used by bullmq
  # Denied: postinstall only prints a funding banner.
  core-js: false
  core-js-pure: false

# -----------------------------------------------------------------------------
# Catalogs — one version of every shared dependency across the whole repo
# -----------------------------------------------------------------------------
catalogMode: strict
catalogPrune: true

catalog:
  # --- tooling ---
  tsx: 4.23.13
  tsup: 8.5.1
  rimraf: 6.0.1
  dotenv: 17.4.2
  "@types/node": 26.4.1

  # --- lint / format ---
  eslint: 10.10.0
  typescript-eslint: 8.69.0
  "@eslint/js": 10.0.1
  eslint-config-prettier: 10.1.8
  globals: 16.5.0
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1

  # --- test ---
  vitest: 5.0.0
  "@playwright/test": 1.62.1
  happy-dom: 20.14.0

  # --- shared runtime ---
  zod: 4.5.4
  pino: 10.3.1
  pino-pretty: 13.1.3

  # --- data layer ---
  prisma: 7.10.0
  "@prisma/client": 7.10.0
  "@prisma/adapter-pg": 7.10.0

  # --- server ---
  fastify: 5.12.3
  fastify-plugin: 6.0.0
  fastify-type-provider-zod: 7.0.0
  "@fastify/cors": 11.3.0
  "@fastify/helmet": 13.1.1
  "@fastify/rate-limit": 11.2.0
  "@fastify/swagger": 9.8.1
  "@fastify/swagger-ui": 6.1.1
  "@fastify/cookie": 11.1.2
  "@fastify/sensible": 6.0.5
  "@fastify/under-pressure": 9.1.0
  "@fastify/request-context": 7.0.0
  openapi-types: 12.1.3
  close-with-grace: 2.2.0

  # --- queues / cache ---
  bullmq: 6.3.4
  ioredis: 5.9.0

  # --- auth ---
  better-auth: 1.7.2
  "@better-auth/redis-storage": 1.7.2

catalogs:
  react19:
    react: 19.2.8
    react-dom: 19.2.8
    "@types/react": 19.2.7
    "@types/react-dom": 19.2.4

  next16:
    next: 16.3.4
    eslint-config-next: 16.3.4
    next-intl: 4.14.2
    next-themes: 0.4.6
    tailwindcss: 4.3.3
    "@tailwindcss/postcss": 4.3.3
    babel-plugin-react-compiler: 1.0.0

  ui:
    "@radix-ui/react-avatar": 1.2.6
    "@radix-ui/react-checkbox": 1.3.4
    "@radix-ui/react-dialog": 1.1.23
    "@radix-ui/react-direction": 1.1.4
    "@radix-ui/react-dropdown-menu": 2.1.24
    "@radix-ui/react-label": 2.1.10
    "@radix-ui/react-popover": 1.1.23
    "@radix-ui/react-progress": 1.1.10
    "@radix-ui/react-scroll-area": 1.2.13
    "@radix-ui/react-select": 2.3.7
    "@radix-ui/react-separator": 1.1.10
    "@radix-ui/react-slot": 1.3.3
    "@radix-ui/react-switch": 1.3.7
    "@radix-ui/react-tabs": 1.1.21
    "@radix-ui/react-tooltip": 1.2.14
    class-variance-authority: 0.7.1
    clsx: 2.1.1
    tailwind-merge: 3.6.0
    lucide-react: 1.41.0
    recharts: 3.10.1
    "@tanstack/react-table": 9.2.4
    sonner: 2.0.8
    cmdk: 1.1.1
allowUnusedPatches: false
minimumReleaseAgeExclude:
  - "@eslint/plugin-kit@0.7.3"
  - eslint@10.10.0
  - fastify@5.12.3
  - happy-dom@20.14.0
  - lucide-react@1.41.0
